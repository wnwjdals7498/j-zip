<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>테스트 결과와 분할 파일 안내</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FEB}a:hover{color:#174EA6}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:#B4235A;color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;margin-left:6px}
</style>
</helmet>
<div style="width: 760px; height: 480px; box-sizing: border-box; padding: 20px; display: flex; gap: 20px; align-items: flex-start; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #1B1F24; background: #E9ECEF">

  <div style="flex: 1; background: #FFFFFF; border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-weight: 500">테스트 결과<span class="tag">#20</span><span class="tag">#24</span></div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: inline-flex; width: 28px; height: 28px; border-radius: 14px; background: #FBE1E3; color: #9F1C26; align-items: center; justify-content: center; font-weight: 700">!</span>
        <div style="display: flex; flex-direction: column">
          <span style="font-weight: 700">파일 2개가 손상됨</span>
          <span style="font-size: 12px; color: #57606A">자료_백업.zip · 정상 126개</span>
        </div>
      </div>
      <div style="border: 1px solid #E3E6EA; border-radius: 6px">
        <div style="display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #EEF0F2"><span>회의록_0917.docx</span><span style="color: #9F1C26; font-size: 12px">CRC 오류</span></div>
        <div style="display: flex; justify-content: space-between; padding: 8px 10px"><span>도면/1층_평면.dwg</span><span style="color: #9F1C26; font-size: 12px">데이터 끝남</span></div>
      </div>
      <div style="display: flex; align-items: center; font-size: 12px; color: #57606A">악성코드 검사 (Microsoft Defender): 위협 없음<span class="tag">#21</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button style="height: 34px; border: 0; border-radius: 6px; background: #1F6FEB; color: #FFFFFF; font: inherit; font-weight: 500">정상 파일 126개만 풀기</button>
        <div style="display: flex; gap: 8px">
          <button style="flex: 1; height: 34px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF; font: inherit">복구 시도…</button>
          <button style="flex: 1; height: 34px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF; font: inherit">결과 복사</button>
        </div>
      </div>
    </div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-weight: 500">분할 압축 파일<span class="tag">#33</span></div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 8px 10px; border-radius: 6px; background: #E8F0FE; color: #174EA6">두 번째 조각을 열었음. 첫 조각부터 자동으로 이어서 엶.</div>
      <div style="border: 1px solid #E3E6EA; border-radius: 6px">
        <sc-for list="{{parts}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #EEF0F2">
            <span style="font-weight: {{p.weight}}">{{p.name}}</span>
            <span style="font-size: 12px; font-weight: 500; color: {{p.color}}">{{p.state}}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #57606A">4번째 조각이 없어서 마지막 파일 2개는 풀 수 없음</span>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 34px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF; font: inherit">빠진 조각 찾기…</button>
        <button style="flex: 1; height: 34px; border: 0; border-radius: 6px; background: #1F6FEB; color: #FFFFFF; font: inherit; font-weight: 500">있는 만큼 풀기</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['자료.part1.rar', '찾음', true], ['자료.part2.rar', '찾음 · 연 파일', true],
      ['자료.part3.rar', '찾음', true], ['자료.part4.rar', '없음', false]
    ];
    const parts = raw.map(([name, state, ok]) => ({
      name, state, color: ok ? '#1A7F37' : '#9F1C26', weight: ok ? '400' : '700'
    }));
    return { parts };
  }
}
</script>
</body>
</html>
