<x-dc>
<helmet>

<style>

a{color:#1F6FEB}a:hover{color:#174EA6}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:#B4235A;color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;margin-left:6px}
.mi{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:0;border-radius:4px;background:transparent;font:inherit;color:#1B1F24;text-align:left;width:100%}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 760px; height: 540px; box-sizing: border-box; padding: 24px; position: relative; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #1B1F24; background: #DDE3EA">

  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px">
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 32px; border-radius: 4px; background: #8A6D1F; color: #FFFFFF; font-size: 10px; font-weight: 700">ZIP</span>
    <span style="font-weight: 500">사진_2026.zip</span>
    <span style="color: #57606A; font-size: 12px">우클릭</span>
    <span class="tag">#19</span>
  </div>

  <div style="display: flex; gap: 4px; align-items: flex-start">
    <div style="width: 280px; padding: 6px; border-radius: 8px; background: #FAFAFA; border: 1px solid #C9CFD6; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; gap: 4px; padding: 2px 4px 6px; border-bottom: 1px solid #E3E6EA; margin-bottom: 4px">
        <button aria-label="잘라내기" style="width: 36px; height: 32px; border: 0; border-radius: 4px; background: transparent"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L18 4 M16 16L6 4"/></svg></button>
        <button aria-label="복사" style="width: 36px; height: 32px; border: 0; border-radius: 4px; background: transparent"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></svg></button>
        <button aria-label="이름 바꾸기" style="width: 36px; height: 32px; border: 0; border-radius: 4px; background: transparent"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>

      </div>
      <button class="mi">열기</button>
      <button class="mi" style="background: #E8F0FE">

      <button class="mi">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg>
        <span style="flex: 1">"사진_2026\"에 풀기</span>
      </button>
      <button class="mi" style="background: #EEF0F2">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z M4 7l2-3h12l2 3"/></svg>
        <span style="flex: 1">j-zip</span><span style="color: #57606A">›</span>

      <div style="height: 1px; background: #E3E6EA; margin: 4px 0"></div>
      <button class="mi">공유</button>
      <button class="mi">속성</button>
      <div style="height: 1px; background: #E3E6EA; margin: 4px 0"></div>
      <button class="mi" style="color: #57606A">추가 옵션 표시</button>
    </div>

    <div style="width: 270px; margin-top: 96px; padding: 6px; border-radius: 8px; background: #FAFAFA; border: 1px solid #C9CFD6; display: flex; flex-direction: column; gap: 2px">
      <button class="mi">다른 위치에 풀기…</button>
      <button class="mi">미리보기로 열기</button>
      <button class="mi">압축 파일 테스트</button>
      <button class="mi"><span style="flex: 1">해시 값 계산</span><span style="color: #57606A">›</span></button>
      <div style="height: 1px; background: #E3E6EA; margin: 4px 0"></div>
      <button class="mi">"사진_2026.7z"로 다시 압축</button>
      <button class="mi">압축 옵션 지정…</button>
      <div style="height: 1px; background: #E3E6EA; margin: 4px 0"></div>
      <button class="mi" style="color: #57606A">메뉴 항목 편집…</button>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 20px; display: flex; gap: 12px">
    <div style="flex: 1; padding: 10px 12px; border-radius: 6px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 700; display: flex; align-items: center">여러 개 선택 시<span class="tag">#35</span></span>
      <span style="font-size: 12px; color: #57606A">최상단: "각각 폴더로 풀기 (3개)" · "하나로 압축"</span>
    </div>
    <div style="flex: 1; padding: 10px 12px; border-radius: 6px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 700; display: flex; align-items: center">일반 파일·폴더<span class="tag">#18</span><span class="tag">#34</span></span>
      <span style="font-size: 12px; color: #57606A">최상단: "자료.zip으로 압축" · "자료.7z로 압축"</span>
    </div>
  </div>
</div>
