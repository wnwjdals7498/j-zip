<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정 창</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FEB}a:hover{color:#174EA6}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:#B4235A;color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;margin-left:6px}
</style>
</helmet>
<div style="width: 920px; height: 620px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #1B1F24; background: #FFFFFF; border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
  <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-weight: 500">
    설정
    <div style="flex: 1"></div>
    <span style="color: #57606A" aria-hidden="true">✕</span>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <nav style="width: 200px; padding: 12px 8px; box-sizing: border-box; background: #F5F6F8; border-right: 1px solid #D8DCE1; display: flex; flex-direction: column; gap: 2px" aria-label="설정 분류">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
        <a href="#" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 6px; text-decoration: none; background: {{n.bg}}; color: {{n.color}}; font-weight: {{n.weight}}">
          <span style="flex: 1">{{n.name}}</span>
          <sc-if value="{{n.hasTag}}" hint-placeholder-val="{{ false }}"><span class="tag">{{n.tag}}</span></sc-if>
        </a>
      </sc-for>
    </nav>

    <div style="flex: 1; min-width: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0; font-size: 18px; display: flex; align-items: center">탐색기 메뉴<span class="tag">#34</span><span class="tag">#19</span></h2>
        <span style="color: #57606A">우클릭했을 때 보일 항목과 위치를 고름</span>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; gap: 20px">
        <legend style="font-weight: 700; padding: 0; margin-bottom: 8px">메뉴 방식</legend>
        <label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="menu" checked>Windows 11 새 메뉴 + 추가 옵션</label>
        <label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="menu">예전 메뉴만</label>
      </fieldset>

      <div style="border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
        <div style="display: grid; grid-template-columns: 1fr 100px 100px 70px; gap: 8px; padding: 8px 14px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-size: 12px; color: #57606A">
          <span>항목</span><span style="text-align: center">맨 위에</span><span style="text-align: center">7-Zip 안에</span><span style="text-align: center">숨김</span>
        </div>
        <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
          <div style="display: grid; grid-template-columns: 1fr 100px 100px 70px; gap: 8px; align-items: center; padding: 7px 14px; border-bottom: 1px solid #EEF0F2">
            <span>{{it.name}}</span>
            <span style="text-align: center"><input type="radio" name="{{it.key}}" checked="{{it.top}}" aria-label="맨 위에"></span>
            <span style="text-align: center"><input type="radio" name="{{it.key}}" checked="{{it.sub}}" aria-label="7-Zip 안에"></span>
            <span style="text-align: center"><input type="radio" name="{{it.key}}" checked="{{it.off}}" aria-label="숨김"></span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; gap: 20px; flex-wrap: wrap">
        <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked>메뉴에 아이콘 표시</label>
        <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox">Shift 누를 때만 표시</label>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: #F5F6F8; border-top: 1px solid #D8DCE1">
    <button style="height: 34px; padding: 0 14px; border: 0; background: transparent; color: #1F6FEB; font: inherit">기본값으로 되돌리기</button>
    <div style="flex: 1"></div>
    <button style="height: 34px; padding: 0 18px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF; font: inherit">취소</button>
    <button style="height: 34px; padding: 0 22px; border: 0; border-radius: 6px; background: #1F6FEB; color: #FFFFFF; font: inherit; font-weight: 500">저장</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":920,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const navRaw = [
      { name: '일반' },
      { name: '압축 풀기', tag: '#30 #31' },
      { name: '압축' },
      { name: '탐색기 메뉴', on: true },
      { name: '연결 프로그램' },
      { name: '보안', tag: '#21' },
      { name: '화면·언어', tag: '#28 #22' }
    ];
    const nav = navRaw.map((n) => ({
      name: n.name, tag: n.tag || '', hasTag: !!n.tag,
      bg: n.on ? '#E8F0FE' : 'transparent', color: n.on ? '#174EA6' : '#1B1F24', weight: n.on ? '700' : '400'
    }));
    const raw = [
      ['여기에 풀기 (스마트)', 'top'], ['"폴더명\\"에 풀기', 'top'], ['다른 위치에 풀기…', 'sub'],
      ['"이름.zip"으로 압축', 'top'], ['"이름.7z"로 압축', 'sub'], ['압축 파일 테스트', 'sub'], ['해시 값 계산', 'off']
    ];
    const items = raw.map(([name, pos], i) => ({
      name, key: 'm' + i, top: pos === 'top', sub: pos === 'sub', off: pos === 'off'
    }));
    return { nav, items };
  }
}
</script>
</body>
</html>
