<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비밀번호 입력과 관리자</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6FEB}a:hover{color:#174EA6}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;background:#B4235A;color:#FFFFFF;font-size:11px;font-weight:700;line-height:18px;margin-left:6px}
</style>
</helmet>
<div style="width: 880px; height: 500px; box-sizing: border-box; padding: 20px; display: flex; gap: 20px; align-items: flex-start; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: #1B1F24; background: #E9ECEF">

  <div style="width: 380px; background: #FFFFFF; border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-weight: 500">암호 입력</div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 500">항공권_확인서.pdf</span>
        <span style="font-size: 12px; color: #57606A">사진_2026.zip 안 · AES-256</span>
      </div>
      <div style="padding: 8px 10px; border-radius: 6px; background: #FBEFD0; color: #7A4F00; font-size: 12px">저장된 암호 3개를 먼저 넣어 봤지만 맞지 않음</div>
      <label for="pw" style="font-weight: 700">암호</label>
      <div style="display: flex; gap: 6px">
        <input id="pw" type="password" value="password" style="flex: 1; height: 34px; padding: 0 10px; border: 1px solid #1F6FEB; border-radius: 6px; font: inherit">
        <button aria-label="암호 보기" style="width: 34px; height: 34px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#1B1F24" stroke-width="1.8" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked>이 암호를 관리자에 저장<span class="tag">#23</span></label>
      <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked>이 압축 파일의 나머지 파일에도 사용</label>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button style="height: 34px; padding: 0 16px; border: 1px solid #D8DCE1; border-radius: 6px; background: #FFFFFF; font: inherit">건너뛰기</button>
        <button style="height: 34px; padding: 0 20px; border: 0; border-radius: 6px; background: #1F6FEB; color: #FFFFFF; font: inherit; font-weight: 500">확인</button>
      </div>
    </div>
  </div>

  <div style="flex: 1; background: #FFFFFF; border: 1px solid #D8DCE1; border-radius: 8px; overflow: hidden">
    <div style="display: flex; align-items: center; height: 40px; padding: 0 16px; background: #F5F6F8; border-bottom: 1px solid #D8DCE1; font-weight: 500">
      암호 관리자<span class="tag">#23</span>
      <div style="flex: 1"></div>
      <button style="height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #1F6FEB; color: #FFFFFF; font: inherit; font-size: 12px">+ 추가</button>
    </div>
    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: grid; grid-template-columns: 1fr 90px 90px 60px; gap: 8px; padding: 4px 8px; font-size: 12px; color: #57606A">
        <span>이름</span><span>암호</span><span>마지막 사용</span><span></span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: grid; grid-template-columns: 1fr 90px 90px 60px; gap: 8px; align-items: center; padding: 8px; border: 1px solid #E3E6EA; border-radius: 6px">
          <span style="font-weight: 500">{{r.name}}</span>
          <span style="color: #57606A; letter-spacing: 2px">••••••</span>
          <span style="font-size: 12px; color: #57606A">{{r.used}}</span>
          <button style="height: 26px; border: 1px solid #D8DCE1; border-radius: 4px; background: #FFFFFF; font: inherit; font-size: 12px">편집</button>
        </div>
      </sc-for>
      <div style="height: 1px; background: #E3E6EA; margin: 6px 0"></div>
      <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked>압축 풀 때 저장된 암호를 먼저 자동으로 넣어 보기</label>
      <label style="display: flex; align-items: center; gap: 6px"><input type="checkbox">관리자를 열 때 Windows Hello로 확인</label>
      <span style="font-size: 12px; color: #57606A">암호는 이 PC의 Windows 계정으로 암호화해서 저장함 (다른 PC로 복사해도 열리지 않음)</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { name: '회사 공유 자료', used: '오늘' },
        { name: '세무 서류', used: '9월 30일' },
        { name: '가족 사진', used: '8월 12일' },
        { name: '[이름 없음]', used: '7월 2일' }
      ]
    };
  }
}
</script>
</body>
</html>
